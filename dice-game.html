<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dice Game</title>
<style>:root{--bg:#fff;--fg:#18181b;--mut:#71717a;--line:#c4c4cc;--tbl:#efeff1}
[data-theme=dark]{--bg:#18181b;--fg:#f4f4f5;--mut:#a1a1aa;--line:#52525b;--tbl:#2a2a2e}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{max-width:560px;margin:0 auto;padding:10px}
button,select,input:not([type=radio]){font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button{cursor:pointer}button:disabled{opacity:.4}
button.r{background:#dc2626;color:#fff;border-color:#dc2626;font-weight:700;width:100%;padding:14px;margin-top:8px}
h1{font-size:22px;text-align:center}h3{margin:16px 0 4px}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mut,small{color:var(--mut)}.msg{text-align:center;color:var(--mut);min-height:20px;margin:4px 0}
.rules{font-size:14px;color:var(--mut);line-height:1.45}
.box{border:2px solid var(--fg);border-radius:8px;padding:10px;margin:8px 0;text-align:center}
.die{--c:#52525b;width:38px;height:38px;border-radius:9px;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;position:relative;vertical-align:middle}
.die.sm{width:20px;height:20px;border-radius:5px;font-size:11px;margin:1px}
.die small{position:absolute;right:2px;bottom:0;font-size:9px;color:#fff}
.die.h{background:var(--line)}.die.dim{opacity:.5}.die.t{outline:3px solid #2563eb;cursor:pointer}
.pp{display:grid;grid:repeat(3,1fr)/repeat(3,1fr);width:74%;height:74%}.pp i{border-radius:50%;margin:10%}.pp i.o{background:#fff}
.ring{position:relative;width:min(100%,44vh,460px);aspect-ratio:1;margin:0 auto}
.ring::before{content:'';position:absolute;inset:17%;border-radius:50%;background:var(--tbl)}
.n{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:11px;width:92px;padding:3px;border-radius:8px;border:2px solid transparent}
.n.on{border-color:var(--fg)}.n.out{opacity:.35}.n.t{outline:3px solid #2563eb;cursor:pointer}
.n button{padding:1px 6px;font-size:11px}.col{display:flex;flex-direction:column;align-items:center}
.ctr{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:36%;line-height:1.25}
</style></head><body><div id="app"></div>

<script>
// ===== CONFIG: set this to your Pi's websocket URL =====
const SERVER = 'wss://ws.evansolid.com', GAME='dice-game';

// ===== DICE TYPES: add a new die by adding an entry here =====
// n=name c=color d=description. Optional action: ok(ctx)->can use, pick(ctx)->list of target kinds
// ('die:opp','die:own','die:free','player:free'), run(ctx,targets)->log text. Passive dice (Normal,
// Chameleon, Little Guy, Reroll, Thief, Shield) are handled by sv/ev/tally/score below.
const DICE={
normal:{n:'Normal',c:'#52525b',d:'Counts as itself. Lost first when you lose a die.'},
cham:{n:'Chameleon',c:'#16a34a',d:'Counts once extra for each other die type in your hand showing 2, 4 or 6.'},
adder:{n:'Adder',c:'#ea8a0c',d:'Action: attach to another die. Both become (sum mod 6) and count at that value.',
 ok:c=>!c.d.l&&c.fd>0,pick:()=>['die:free'],run:(c,[t])=>{c.d.l=t.id;t.l=c.d.id;return c.p.name+' attaches an Adder'}},
attack:{n:'Attack',c:'#dc2626',d:'Action: sacrifice to destroy an opponent die (a Shield is lost instead).',
 ok:c=>c.opps.length>0,pick:()=>['die:opp'],run:(c,[t])=>{const o=c.owner(t),s=o.hand.find(x=>x.t==='shield');c.sac(c.d);c.sac(s||t);return c.p.name+' attacks '+o.name+(s?' (Shield lost)':'')}},
shield:{n:'Shield',c:'#2563eb',d:'Blocks one Attack on you (lost instead). While held, Chaos cannot target you.'},
little:{n:'Little Guy',c:'#0d9488',d:'Counts as half its face, rounded up (1,1,2,2,3,3).'},
ruckus:{n:'Ruckus',c:'#db2777',d:'Action: sacrifice to reroll an opponent die and one of yours (two of yours if no opponents).',
 ok:c=>c.opps.length>0||c.own>1,pick:c=>c.opps.length?(c.own?['die:opp','die:own']:['die:opp']):['die:own','die:own'],
 run:(c,t)=>{c.sac(c.d);t.forEach(x=>x.v=R(6));return c.p.name+' causes a Ruckus'}},
chaos:{n:'Chaos',c:'#7c3aed',d:'Action: sacrifice to give an opponent a Reroll die and yourself a Normal die.',
 ok:()=>true,pick:c=>c.np.length?['player:free']:[],run:(c,[t])=>{c.sac(c.d);c.add(t||c.p,'reroll');c.add(c.p,'normal');return c.p.name+' unleashes Chaos'}},
reroll:{n:'Reroll',c:'#ca8a04',d:'Rerolled as soon as Liar is called, before scoring.'},
thief:{n:'Thief',c:'#475569',d:'After scoring, if it shows the called face, swap it with an opponent die showing that face.'}
};

// ===== SHARED RULES (used by host logic and every client's UI) =====
const $=s=>document.querySelector(s),R=n=>1+Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const find=(P,id)=>{for(const p of P){const d=p.hand.find(x=>x.id===id);if(d)return[p,d]}return[]};
const sv=(P,d)=>{const q=d.l&&find(P,d.l)[1];return q?(d.v+q.v-1)%6+1:d.v};          // shown value (after Adder)
const ev=(P,d)=>d.t==='little'?Math.ceil(sv(P,d)/2):sv(P,d);                         // counted value
const shd=p=>p.hand.some(x=>x.t==='shield');
function tally(P,f){let n=0;for(const p of P){const ty=new Set;p.hand.forEach(d=>sv(P,d)%2===0&&ty.add(d.t));ty.delete('cham');
 for(const d of p.hand){const e=ev(P,d);if(e===f||e===1)n+=d.t==='cham'?1+ty.size:1}}return n}
const ctx=(P,p,d,f)=>{const opps=P.filter(x=>x!==p&&x.hand.length);
 return{P,p,d,f,opps,np:opps.filter(x=>!shd(x)),own:p.hand.length-1,fd:P.reduce((n,x)=>n+x.hand.filter(y=>y!==d&&!y.l).length,0)}};
function chk(k,id,c){const[o,t]=find(c.P,id);
 if(k==='die:opp')return!!t&&o!==c.p;
 if(k==='die:own')return!!t&&o===c.p&&t!==c.d;
 if(k==='die:free')return!!t&&t!==c.d&&!t.l;
 if(k==='die:swap')return!!t&&o!==c.p&&sv(c.P,t)===c.f;
 return k==='player:free'&&c.np.some(x=>x.id===id)}
const acts=(P,p,f)=>p.hand.filter(d=>{const D=DICE[d.t];return D.ok&&D.ok(ctx(P,p,d,f))});
const valid=(n,b)=>!b||n.q>b.q||n.q===b.q&&n.f>b.f;

// ===== NETWORK =====
let ws,me,host,code,token,roster=[],S=null,G=null,myDice=[],mode='classic',err='',conn=0,sel=null,draft=null,dk='',picks={},lm=5,uname='',ccode='';
const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function open(first){ws=new WebSocket(SERVER);ws.onopen=()=>{conn=1;tx(first);render()};ws.onmessage=e=>onMsg(JSON.parse(e.data));
 ws.onclose=()=>{conn=0;if(code&&token)setTimeout(()=>open({t:'rejoin',code,token}),2000);render()}}
const go=m=>{err='';ws&&ws.readyState===1?tx(m):open(m)};
function reset(){code=token=host=null;S=G=null;myDice=[];sel=null;sessionStorage.removeItem('s');if(ws){ws.onclose=null;ws.close()}conn=0}
const leave=()=>{tx({t:'leave'});reset();render()};
const send=d=>host===me?handle(me,d):tx({t:'relay',to:host,data:d});
function onMsg(m){switch(m.t){
case'joined':code=m.code;token=m.token;me=m.id;host=m.host;roster=m.players;S=m.state;myDice=(m.priv&&m.priv.dice)||[];
 sessionStorage.s=JSON.stringify({code,token});
 if(m.secret)G=m.secret;else if(host===me){G=newG();publish();return}break;
case'players':roster=m.players;host=m.host;if(host===me&&G){onRoster();return}break;
case'state':S=m.data;break;
case'priv':myDice=m.data.dice;break;
case'relay':if(host===me&&m.data)handle(m.from,m.data);return;
case'host':host=me;G=m.secret||newG();break;
case'closed':err='Room closed';reset();break;
case'error':err=m.msg;if(m.fatal)reset();break}
render()}

// ===== HOST-SIDE GAME LOGIC (runs only in the host's browser) =====
const pl=id=>G.players.find(p=>p.id===id),alive=()=>G.players.filter(p=>p.hand.length);
const off=id=>{const r=roster.find(x=>x.id===id);return!r||!r.online};
function ord(id){const P=G.players,i=Math.max(0,P.findIndex(p=>p.id===id));return[...P.slice(i),...P.slice(0,i)].filter(p=>p.hand.length)}
const nextAlive=id=>(ord(id).find(p=>p.id!==id)||{}).id;
const newG=()=>({phase:'lobby',mode,max:5,round:0,nid:1,players:[],picks:{},ready:{},hist:[],msg:''});
function pub(){const rev=['act','thief','res','over'].includes(G.phase),{picks,players,...r}=G;
 return{...r,players:players.map(p=>({id:p.id,name:p.name,n:p.hand.length,hand:rev?p.hand:undefined}))}}
function publish(){S=pub();tx({t:'state',data:S});tx({t:'secret',data:G});
 G.players.forEach(p=>tx({t:'priv',to:p.id,data:{dice:p.hand}}));const m=pl(me);myDice=m?m.hand:[];render()}
function sac(d){const[o]=find(G.players,d.id);if(!o)return;o.hand=o.hand.filter(x=>x!==d);const q=d.l&&find(G.players,d.l)[1];if(q)q.l=null}
const hc=(p,d)=>({...ctx(G.players,p,d,G.bet&&G.bet.f),sac,add:(q,t)=>q.hand.push({id:G.nid++,t,v:R(6)}),owner:t=>find(G.players,t.id)[0]});
function start(){G.players=roster.map(r=>{const t=G.mode==='unusual'&&G.ready[r.id]?G.picks[r.id]:{normal:G.max},hand=[];
 for(const k in t)for(let i=0;i<t[k];i++)hand.push({id:G.nid++,t:k,v:1});return{id:r.id,name:r.name,hand}});
 tx({t:'lock',on:true});G.round=0;G.starter=G.players[0].id;nextRound()}
function nextRound(){G.round++;G.players.forEach(p=>p.hand.forEach(d=>{d.v=R(6);d.l=null}));
 G.bet=null;G.hist=[];G.res=null;G.th=null;G.act=null;G.turn=G.starter;G.phase='bet';G.msg=pl(G.turn).name+' starts the round'}
function advAct(s){const a=G.act,n=a.ord.length;
 for(let k=0;k<n;k++){const j=(s+k)%n,id=a.ord[j],p=pl(id);if(a.pass[id])continue;
  if(!p.hand.length||off(id)||!acts(G.players,p,G.bet.f).length){a.pass[id]=1;continue}a.i=j;a.cur=id;return}
 score()}
function score(){const b=G.bet,P=G.players,total=tally(P,b.f),ok=total>=b.q,loser=ok?G.caller:b.by,lp=pl(loser);
 G.res={total,ok,loser};
 if(lp.hand.length){const pool=lp.hand.filter(d=>d.t==='normal'),c=pool.length?pool:lp.hand,d=c[R(c.length)-1];G.res.lost=d.t;sac(d)}
 const q=[];ord(G.caller).forEach(p=>p.hand.forEach(d=>d.t==='thief'&&sv(P,d)===b.f&&q.push({p:p.id,d:d.id})));
 G.th={q,i:0};G.phase='thief';advThief(0)}
function advThief(i){const t=G.th;
 for(;i<t.q.length;i++){const e=t.q[i],p=pl(e.p),d=p.hand.find(x=>x.id===e.d);if(!d||off(e.p))continue;
  const c=hc(p,d);if(G.players.some(o=>o!==p&&o.hand.some(x=>chk('die:swap',x.id,c)))){t.i=i;t.cur=e;return}}
 t.cur=null;const a=alive();if(a.length<2){G.phase='over';G.winner=a[0]&&a[0].id}else G.phase='res'}
function doAct(id,d){const p=pl(id),x=p.hand.find(y=>y.id===d.die),D=x&&DICE[x.t],ids=d.picks;
 if(!D||!D.ok||!Array.isArray(ids))return;const c=hc(p,x);if(!D.ok(c))return;const k=D.pick(c);
 if(ids.length!==k.length||new Set(ids).size!==ids.length||!k.every((z,i)=>chk(z,ids[i],c)))return;
 G.msg=D.run(c,k.map((z,i)=>z[0]==='d'?find(G.players,ids[i])[1]:pl(ids[i])));return 1}
function doThief(d){const e=G.th.cur,p=pl(e.p),x=p.hand.find(y=>y.id===e.d),id=d.picks&&d.picks[0];
 if(!x||!chk('die:swap',id,hc(p,x)))return;const[o,t]=find(G.players,id);
 p.hand=p.hand.map(y=>y===x?t:y);o.hand=o.hand.map(y=>y===t?x:y);G.msg=p.name+' steals from '+o.name;return 1}
function fix(){const a=alive();if(G.phase!=='over'&&a.length<2){G.phase='over';G.winner=a[0]&&a[0].id;return}
 if(G.phase==='bet'&&!pl(G.turn).hand.length)G.turn=nextAlive(G.turn);
 else if(G.phase==='act'&&!pl(G.act.cur).hand.length)advAct(G.act.i+1);
 else if(G.phase==='thief'&&G.th.cur&&!pl(G.th.cur.p).hand.length)advThief(G.th.i+1)}
function onRoster(){if(G.phase==='lobby'){for(const id in G.ready)if(!roster.some(r=>r.id===id))delete G.ready[id]}
 else{let ch=0;G.players.forEach(p=>{if(p.hand.length&&!roster.some(r=>r.id===p.id)){p.hand=[];ch=1}});if(ch)fix()}publish()}
function handle(from,d){if(!G)return;const ph=G.phase,P=G.players;
 if(ph==='lobby'){
  if(d.a==='ready'){if(d.picks){let s=0;for(const k in d.picks){const n=d.picks[k];if(!DICE[k]||!Number.isInteger(n)||n<0)return;s+=n}
   if(s<1||s>G.max)return;G.picks[from]=d.picks;G.ready[from]=1;if(G.mode==='unusual'&&roster.length>1&&roster.every(r=>G.ready[r.id]))start()}else delete G.ready[from]}
  else if(from!==host)return;
  else if(d.a==='cfg'){G.max=Math.max(1,Math.min(10,d.max|0));G.ready={}}
  else if(d.a==='start'){if(roster.length<2)return;start()}
  else return}
 else if(ph==='bet'){if(from!==G.turn)return;
  if(d.a==='bet'){const n={q:d.q|0,f:d.f|0};if(n.q<1||n.q>P.reduce((s,p)=>s+p.hand.length,0)||n.f<2||n.f>6||!valid(n,G.bet))return;
   if(G.bet)G.hist.push([G.bet.q,G.bet.f]);G.bet={...n,by:from};G.turn=nextAlive(from);G.msg=pl(from).name+' bets '+bt(n.q,n.f)}
  else if(d.a==='liar'&&G.bet){G.caller=from;P.forEach(p=>p.hand.forEach(x=>x.t==='reroll'&&(x.v=R(6))));
   G.msg=pl(from).name+' calls '+pl(G.bet.by).name+' a liar!';
   if(G.mode==='classic')score();else{G.phase='act';G.act={pass:{},i:0,ord:ord(from).map(p=>p.id)};advAct(0)}}
  else return}
 else if(ph==='act'){if(from!==G.act.cur)return;
  if(d.a==='pass')G.act.pass[from]=1;else if(d.a==='act'){if(!doAct(from,d))return}else return;advAct(G.act.i+1)}
 else if(ph==='thief'){if(!G.th.cur||from!==G.th.cur.p)return;
  if(d.a==='act'){if(!doThief(d))return}else if(d.a!=='pass')return;advThief(G.th.i+1)}
 else if(ph==='res'&&d.a==='next'){const l=G.res.loser;G.starter=pl(l).hand.length?l:nextAlive(l);nextRound()}
 else if(ph==='over'&&d.a==='again'&&from===host){G.phase='lobby';G.players=[];G.ready={};G.picks={};G.msg='';G.winner=null;tx({t:'lock',on:false})}
 else return;
 publish()}

// ===== UI =====
let cs={theme:'light',faces:'pips',sort:'off'},showSet=false,showHelp=false;
try{cs={...cs,...JSON.parse(localStorage.cs)}}catch{}
const PIP=[0,[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const face=v=>cs.faces==='pips'?`<span class=pp>${[0,1,2,3,4,5,6,7,8].map(i=>`<i${PIP[v].includes(i)?' class=o':''}></i>`).join('')}</span>`:v;
const W='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' '),T='  twenty thirty forty fifty sixty seventy eighty ninety'.split(' ');
const wd=n=>n<20?W[n]:T[n/10|0]+(n%10?'-'+W[n%10]:''),bt=(q,f)=>q===1?'one '+f:wd(q)+' '+f+'s';
const nm=id=>(S.players.find(p=>p.id===id)||{}).name||'?';
const srt=(h,P)=>cs.sort==='on'?[...h].sort((a,b)=>sv(P,a)-sv(P,b)):h;
const dieSq=f=>`<span class=die style="--c:#18181b">${face(f)}</span>`;
const cx0=id=>{const P=S.players,p=P.find(x=>x.id===me);return ctx(P,p,p.hand.find(d=>d.id===id),S.bet&&S.bet.f)};
const cx=()=>cx0(sel.die);
const fire=()=>{send({a:'act',die:sel.die,picks:sel.picks});sel=null;render()};
const pd=id=>{sel.picks.push(id);sel.picks.length===sel.kinds.length?fire():render()},pp=pd;
function sa(did){const d=S.players.find(x=>x.id===me).hand.find(x=>x.id===did);sel={die:did,kinds:DICE[d.t].pick(cx0(did)),picks:[]};sel.kinds.length?render():fire()}
const hint=()=>'Select '+({'die:opp':"an opponent's die",'die:own':'one of your other dice','die:free':'a die to attach to','die:swap':"an opponent's die showing "+S.bet.f,'player:free':'an opponent (no Shield)'})[sel.kinds[sel.picks.length]];
const cfg=dl=>send({a:'cfg',max:S.max+dl});
const rdy=()=>send({a:'ready',picks:S.ready[me]?null:{...picks}});
function pk(k,dl){const n=(picks[k]||0)+dl;if(n<0||Object.values(picks).reduce((a,b)=>a+b,0)+dl>S.max)return;picks[k]=n;S.ready[me]?send({a:'ready',picks:null}):render()}
function setc(k,v){cs[k]=v;try{localStorage.cs=JSON.stringify(cs)}catch{}render()}
const sopt=(k,l)=>`<select onchange="setc('${k}',this.value)">${l.map(([v,t])=>`<option value="${v}"${cs[k]===v?' selected':''}>${t}</option>`).join('')}</select>`;
const settings=()=>showSet?`<div class=row><label>Theme ${sopt('theme',[['light','Light'],['dark','Dark']])}</label><label>Dice ${sopt('faces',[['numbers','Numbers'],['pips','Pips']])}</label><label>Sort my dice ${sopt('sort',[['off','Off'],['on','On']])}</label></div>`:'';

const help=()=>showHelp&&S&&S.mode==='unusual'?`<div class=rules>${Object.values(DICE).map(D=>`<p><span class="die sm" style="--c:${D.c}"></span> <b>${D.n}</b>: ${D.d}</p>`).join('')}</div>`:'';
const menu=()=>`<h1>Dice Game</h1>
<div class=row><input placeholder="Your name" maxlength=16 value="${esc(uname)}" oninput="uname=this.value"></div>
<div class=row><label><input type=radio name=md ${mode==='classic'?'checked':''} onchange="mode='classic'"> Classic</label>
<label><input type=radio name=md ${mode==='unusual'?'checked':''} onchange="mode='unusual'"> Unusual</label></div>
<div class=row><button onclick="go({t:'create',game:GAME,name:uname})">Create game</button></div>
<div class=row><input placeholder="Room code" maxlength=4 size=8 value="${esc(ccode)}" oninput="ccode=this.value.toUpperCase()"><button onclick="go({t:'join',code:ccode,name:uname})">Join game</button></div>
<div class=msg style="color:#dc2626">${esc(err)}</div>
<div class=rules><h3>How to play</h3>
<p>Everyone rolls their dice in secret. Players take turns making a bet about how many dice of one face (2 to 6) are on the whole table, for example "four 5s". Ones are wild and count as every face.</p>
<p>Each bet must be higher than the last: more dice, or the same number of dice with a higher face. Instead of raising, you can call the previous player a liar.</p>
<p>When Liar is called, everyone reveals their dice. If there are at least as many matching dice as the bet, the caller loses a die. Otherwise the bettor loses one. The loser starts the next round, and the last player with dice wins.</p>
<p>Unusual mode adds special dice types with abilities. After Liar is called, players take turns using them before the count.</p></div>`;

function render(){document.body.dataset.theme=cs.theme;const a=$('#app'),H=host===me;
 const bar=`<div class=row style="justify-content:space-between"><b>${code&&(!S||S.phase==='lobby')?'Room '+code:''}</b><span>${conn||!code?'':'reconnecting… '}${S&&S.mode==='unusual'?`<button onclick="showHelp=!showHelp;render()">?</button> `:''}<button onclick="showSet=!showSet;render()">Settings</button>${code?` <button onclick="${H?"tx({t:'close'})":'leave()'}">${H?'Close room':'Leave'}</button>`:''}</span></div>${settings()}${help()}`;
 if(!code){if(document.activeElement&&document.activeElement.tagName==='INPUT')return;a.innerHTML=bar+menu();return}
 a.innerHTML=bar+(!S?'<div class=msg>Waiting for host…</div>':S.phase==='lobby'?lobby():table())}

function lobby(){const un=S.mode==='unusual',H=host===me;
 if(S.max!==lm){lm=S.max;picks={}}
 const ks=Object.keys(DICE),used=Object.values(picks).reduce((a,b)=>a+b,0),rd=S.ready[me],sl=[];
 ks.forEach(k=>{for(let i=0;i<(picks[k]||0);i++)sl.push(k)});
 let h=un?`<div class=row>${Array.from({length:S.max},(_,i)=>`<span class="die${sl[i]?'':' h'}"${sl[i]?` style="--c:${DICE[sl[i]].c}"`:''}></span>`).join('')}</div>`:'';
 h+=`<div class=msg><b>${un?'Unusual':'Classic'} mode</b><br>${roster.map(r=>esc(r.name)+(r.id===host?' (host)':'')+(un&&S.ready[r.id]?' ✓':'')+(r.online?'':' (offline)')).join(', ')}</div>
<div class=row style="flex-direction:column;gap:4px;margin:16px 0">Dice each<b style="font-size:44px;line-height:1">${S.max}</b>${H?`<div><button onclick="cfg(-1)">−</button> <button onclick="cfg(1)">+</button></div>`:''}</div>`;
 if(un)h+=ks.map(k=>`<div class=row style="justify-content:space-between;flex-wrap:nowrap"><span><span class="die sm" style="--c:${DICE[k].c}"></span> <b>${DICE[k].n}</b></span><span><button onclick="pk('${k}',-1)" ${picks[k]?'':'disabled'}>−</button> <b>${picks[k]||0}</b> <button onclick="pk('${k}',1)" ${used<S.max?'':'disabled'}>+</button></span></div>`).join('')+
  `<div class=row><button onclick="rdy()" ${used<1?'disabled':''}>${rd?'Not ready':'Ready'}</button></div><div class=msg>The game starts when everyone is ready.</div>`;
 return h+(H?`<div class=row><button onclick="send({a:'start'})" ${roster.length<2?'disabled':''}>Start game</button></div>`:'')+`<div class=msg>No one can join once the game starts.${H&&roster.length<2?' You need at least 2 players.':''}</div>`}

function dh(d,P,c,k){const D=DICE[d.t],e=ev(P,d),b=S.bet,mt=e===b.f||e===1,t=k&&k[0]==='d'&&!sel.picks.includes(d.id)&&chk(k,d.id,c);
 return`<span class="die sm${t?' t':mt?'':' dim'}" style="--c:${D.c}" title="${D.n}: ${D.d}" ${t?`onclick="pd(${d.id})"`:''}>${face(sv(P,d))}${d.t==='little'?`<small>${e}</small>`:''}${d.l?'<small style="left:2px;right:auto">+</small>':''}</span>`}
function rev(p,P,c,k,an){const f=S.bet.f,ds=srt(p.hand,P),m=ds.filter(d=>{const e=ev(P,d);return e===f||e===1}),o=ds.filter(d=>!m.includes(d)),
 up=`<div style="transform:translate(${-Math.cos(an)*26}px,${-Math.sin(an)*26}px)">${m.map(d=>dh(d,P,c,k)).join('')}</div>`,dn=`<div>${o.map(d=>dh(d,P,c,k)).join('')}</div>`;
 return`<div class=col>${Math.sin(an)>0?up+dn:dn+up}</div>`}

function table(){const P=S.players,N=P.length,mi=Math.max(0,P.findIndex(p=>p.id===me)),ph=S.phase,b=S.bet,H=host===me;
 const cur=ph==='bet'?S.turn:ph==='act'?S.act.cur:ph==='thief'&&S.th.cur?S.th.cur.p:null;
 if(ph==='thief'&&cur===me&&(!sel||sel.die!==S.th.cur.d))sel={die:S.th.cur.d,kinds:['die:swap'],picks:[]};
 else if(sel&&!(cur===me&&(ph==='act'||ph==='thief')))sel=null;
 const c=sel&&cx(),k=sel&&sel.kinds[sel.picks.length];
 const ring=P.map((p,i)=>{const an=(90+(i-mi)*360/N)*Math.PI/180,r=roster.find(x=>x.id===p.id),ofl=!r||!r.online,tp=k&&k[0]==='p'&&chk(k,p.id,c);
  const ds=p.hand?rev(p,P,c,k,an):'<span class="die sm h"></span>'.repeat(p.n);
  return`<div class="n${p.id===cur?' on':''}${p.n?'':' out'}${tp?' t':''}" style="left:${50+35*Math.cos(an)}%;top:${50+35*Math.sin(an)}%" ${tp?`onclick="pp('${p.id}')"`:''}><b>${esc(p.name)}</b>${p.id===me?' (you)':''}${ofl?' · offline':''}<div>${ds||'out'}</div>${ofl&&H&&p.n?`<button onclick="tx({t:'kick',id:'${p.id}'})">Kick</button>`:''}</div>`}).join('');
 const hs=(S.hist||[]).slice(-3);
 const ctr=S.res&&(ph==='res'||ph==='over')?`<b style="font-size:22px">${S.res.total}</b><br><small>${b.f}s counted</small>`:
  b?`<div class=mut style="font-size:12px">${hs.map(([q,f],i)=>`<div style="opacity:${[.25,.4,.6][3-hs.length+i]}">${bt(q,f)}</div>`).join('')}</div><div style="font-size:19px;font-weight:700">${bt(b.q,b.f)}</div><small>${esc(nm(b.by))}</small>`:'<small>No bet yet</small>';
 const ty=ph==='bet'||S.mode!=='unusual'?[]:[...new Set(P.flatMap(p=>(p.hand||[]).map(d=>d.t)))];
 return`<div class=ring>${ring}<div class=ctr>${ctr}</div></div>${ty.length?`<div class=row style="font-size:11px;gap:10px">${ty.map(t=>`<span><span class="die sm" style="--c:${DICE[t].c}"></span> ${DICE[t].n}</span>`).join('')}</div>`:''}<div class=msg>${esc(S.msg||'')}</div>`+ctl(P,P[mi],cur)}

function ctl(P,mp,cur){const ph=S.phase,b=S.bet;
 if(ph==='bet'){const tot=P.reduce((s,p)=>s+p.n,0),un=S.mode==='unusual';
  const h=`<div class=row style="gap:6px">${srt(myDice,[]).map(d=>`<span style="text-align:center"><span class=die style="--c:${DICE[d.t].c}" title="${DICE[d.t].n}: ${DICE[d.t].d}">${face(d.v)}</span>${un?`<br><small>${DICE[d.t].n}</small>`:''}</span>`).join('')}</div>`;
  if(S.turn!==me)return h+`<div class=msg>Waiting for ${esc(nm(S.turn))}…</div>`;
  const o=[];for(let q=b?b.q:1;q<=tot;q++)for(let f=2;f<=6;f++)if(valid({q,f},b))o.push([q,f]);
  const key=S.round+'|'+(b?b.q+'x'+b.f:'');if(dk!==key){dk=key;draft=o.length?{q:o[0][0],f:o[0][1]}:null}
  return h+(o.length?`<div class=box><b>Your bet</b><br><select size=5 style="width:100%;margin:8px 0" onchange="const[q,f]=this.value.split('x');draft={q:+q,f:+f}">${o.map(([q,f])=>`<option value="${q}x${f}"${draft&&draft.q===q&&draft.f===f?' selected':''}>${bt(q,f)}</option>`).join('')}</select><br><button onclick="send({a:'bet',q:draft.q,f:draft.f})">Confirm bet</button></div>`:'')+
   (b?`<button class=r onclick="send({a:'liar'})">Call ${esc(nm(b.by))} a Liar</button>`:'')}
 if(ph==='act'){if(cur!==me)return`<div class=msg>${esc(nm(cur))} is choosing an action…</div>`;
  if(sel)return`<div class=msg>${hint()}</div><div class=row><button onclick="sel=null;render()">Cancel</button></div>`;
  return`<div class=msg>Your action</div><div class=row>${acts(P,mp,b.f).map(d=>`<button onclick="sa(${d.id})">${DICE[d.t].n} (${sv(P,d)})</button>`).join('')}<button onclick="send({a:'pass'})">Pass</button></div>`}
 if(ph==='thief')return cur===me?`<div class=msg>Thief: ${hint()}</div><div class=row><button onclick="send({a:'pass'})">Skip</button></div>`:`<div class=msg>${cur?esc(nm(cur))+' is deciding on a Thief swap…':''}</div>`;
 const r=S.res;
 if(ph==='res')return`<div class=msg style="color:var(--fg)">${r.total} ${r.total===1?'die':'dice'} on the table ${r.total===1?'is a':'are'} ${b.f}${r.total===1?'':'s'}, which ${r.ok?'is':'is not'} greater than or equal to the bet of ${b.q} ${b.q===1?'die':'dice'}. <b>${esc(nm(r.loser))}</b> loses ${r.lost?'a '+DICE[r.lost].n+' die':'a die'}.</div><div class=row><button onclick="send({a:'next'})">Next round</button></div>`;
 return`<div class=row style="font-size:20px"><b>${esc(nm(S.winner))}</b> wins!</div>${host===me?`<div class=row><button onclick="send({a:'again'})">Back to lobby</button></div>`:''}`}

try{const s=JSON.parse(sessionStorage.s||'null');if(s){code=s.code;token=s.token;open({t:'rejoin',code,token})}}catch{}
render();
</script>
<div id="server-status" style="position: fixed; bottom: 0; left: 0;">Checking server...</div>
  <script>
    const statusEl = document.getElementById('server-status');

    fetch('https://ws.evansolid.com/status')
      .then(r => r.json())
      .then(s => {
        statusEl.textContent = `🟢 Server: Online`;
      })
      .catch(() => {
        statusEl.textContent = '🔴 Server: Offline';
      });
  </script>
  </body></html>
