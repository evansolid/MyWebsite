<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games | Evan Solid</title>
<link rel="stylesheet" href="site.css">

<style>
/* Library layout */
.game-library {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 28px 20px;
    margin-top: 32px;
}

/* Individual game */
.game-card {
    display: block;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    transition: transform 160ms ease;
}

.game-card:hover {
    transform: translateY(-4px);
}

.game-card:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 5px;
}

/* Cover image */
.game-cover {
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: var(--surface, #eee);
    border: 1px solid var(--border, #ddd);
}

.game-cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
    transition: filter 160ms ease;
}

.game-card:hover .game-cover img {
    filter: grayscale(35%);
}

/* Text */
.game-info {
    padding-top: 12px;
}

.game-info h2 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    line-height: 1.4;
}

.game-info p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    opacity: .7;
}

/* Smaller screens */
@media (max-width: 480px) {
    .game-library {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 14px;
    }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    .game-card,
    .game-cover img {
        transition: none;
    }

    .game-card:hover {
        transform: none;
    }
}
</style>
</head>

<body>
<div class="wrap">
    <a class="back" href="index.html">&larr; Home</a>

    <h1>Games</h1>
    <p class="lead">Games I've made. Pick one and play.</p>

    <div id="games" class="game-library"></div>
</div>

<script>
// Add games by copying an object and changing its details.
// img is optional. Without it, a grayscale placeholder is generated.
const GAMES = [
    {
        name: "Bomb Game",
        desc: "Description goes here.",
        href: "bomb-game.html"
    },
    {
        name: "Space Game",
        desc: "Description goes here.",
        href: "space-game.html"
    },
    {
        name: "Tower Game",
        desc: "Description goes here.",
        href: "tower-game.html"
    },
    {
        name: "Dice Game",
        desc: "Description goes here.",
        href: "dice-game.html"
    }
];

const esc = value => String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
}[char]));

const gamesElement = document.getElementById("games");

gamesElement.innerHTML = GAMES.map(game => {
    const cover = game.img ||
        `https://picsum.photos/seed/${encodeURIComponent(game.name)}/600/900?grayscale`;

    return `
        <a class="game-card" href="${esc(game.href)}">
            <div class="game-cover">
                <img
                    src="${esc(cover)}"
                    alt="${esc(game.name)} cover"
                    loading="lazy"
                    width="600"
                    height="900"
                >
            </div>
            <div class="game-info">
                <h2>${esc(game.name)}</h2>
                <p>${esc(game.desc)}</p>
            </div>
        </a>
    `;
}).join("");
</script>
</body>
</html>
