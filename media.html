<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Reviews | Evan Solid</title>
<link rel="stylesheet" href="site.css">
<style>
#add{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
#add input{flex:1;min-width:220px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:24px}
.list h3{margin:0 0 6px;border-bottom:1px solid #000}
.list ol,.list ul{margin:0 0 10px;padding-left:24px}
.list li button{padding:0 6px;margin-left:4px;font-size:13px}
#match{border:1px solid #000;padding:16px;margin:20px 0}
#match:empty{display:none}
.vs{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.vs button{padding:18px 28px;font-size:20px}
.wrap{max-width:1300px}
.shelf{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:16px;overflow-x:auto;padding-bottom:16px;border-bottom:8px solid #000}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; Home</a>
<h1>Media Reviews</h1>
<p class="lead">My top five in each category, and a tool for tracking and ranking everything else.</p>

<div id="favs"></div>

<h2>Media list &amp; ranking</h2>
<p class="lead">Add anything you want to read, watch, or play. Then rank a category: you'll be shown head-to-head matchups and pick a winner each time, which builds an absolute ranking.</p>
<form id="add">
  <input id="name" placeholder="Title" autocomplete="off">
  <select id="type"></select>
  <button>Add</button>
</form>
<p id="msg" class="muted">&nbsp;</p>
<div id="match"></div>
<div id="lists" class="lists"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Top 5 favorites: edit these (add img: 'your-image.jpg' to use your own thumbnail) ----------
const FAV = {Movies: [], Shows: [], 'Video Games': [], Books: [], Other: []};
for (const k in FAV) for (let i = 1; i <= 5; i++)
  FAV[k].push({title: `${k} favorite #${i}`, desc: 'Short description.', review: 'Your review goes here.'});

$('favs').innerHTML = Object.entries(FAV).map(([k, items]) =>
  `<h2>Top 5 ${esc(k)}</h2><div class="shelf">` + items.map((it, i) =>
    `<div class="card"><div class="img"><img src="${esc(it.img || `https://picsum.photos/seed/${encodeURIComponent(k + i)}/600/400?grayscale`)}" alt=""></div>` +
    `<div class="body"><h3>${i + 1}. ${esc(it.title)}</h3><p>${esc(it.desc)}</p><p class="rev">${esc(it.review)}</p></div></div>`).join('') + '</div>').join('');

// ---------- Media database (in memory only for now) ----------
const TYPES = ['Movies', 'Shows', 'Video Games', 'Books', 'Other'];
const db = {};
TYPES.forEach(t => db[t] = {ranked: [], unranked: []});   // ranked[0] is the best
let T = null;                                              // active ranking session
$('type').innerHTML = TYPES.map(t => `<option>${t}</option>`).join('');

$('add').onsubmit = e => {
  e.preventDefault();
  const name = $('name').value.trim(), type = $('type').value;
  if (!name) return;
  const d = db[type], dup = [...d.ranked, ...d.unranked].some(x => x.toLowerCase() === name.toLowerCase());
  $('msg').textContent = dup ? `"${name}" is already in ${type}.` : `Added "${name}" to ${type}.`;
  if (!dup) d.unranked.push(name);
  $('name').value = ''; $('name').focus(); render();
};

function render() {
  $('lists').innerHTML = TYPES.map(t => {
    const d = db[t], n = d.ranked.length + d.unranked.length;
    const btn = (a, i, label, title) => `<button data-a="${a}" data-t="${t}" data-i="${i}" title="${title}">${label}</button>`;
    return `<div class="list"><h3>${t} <small>(${n})</small></h3>` +
      (d.ranked.length ? `<ol>${d.ranked.map((x, i) => `<li>${esc(x)}${btn('unrank', i, '&#8634;', 'Re-rank this one')}${btn('delr', i, '&times;', 'Remove')}</li>`).join('')}</ol>` : '') +
      (d.unranked.length ? `<p class="muted">Unranked:</p><ul>${d.unranked.map((x, i) => `<li>${esc(x)}${btn('delu', i, '&times;', 'Remove')}</li>`).join('')}</ul>` : '') +
      (n === 0 ? '<p class="muted">Nothing here yet.</p>' : '') +
      (d.unranked.length && n > 1 ? `<button data-a="rank" data-t="${t}">Rank ${d.unranked.length} unranked</button>` : '') + '</div>';
  }).join('');
}
$('lists').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (T) { $('msg').textContent = 'Finish or cancel the current ranking first.'; return; }
  const d = db[b.dataset.t], i = +b.dataset.i, a = b.dataset.a;
  if (a === 'unrank') d.unranked.push(d.ranked.splice(i, 1)[0]);
  else if (a === 'delr') d.ranked.splice(i, 1);
  else if (a === 'delu') d.unranked.splice(i, 1);
  else if (a === 'rank') { T = {t: b.dataset.t}; nextItem(); return; }
  render();
};

// ---------- Ranking: binary insertion. Each new item is compared against the middle of the ranked list,
// then the upper or lower half, and so on, so placing an item takes about log2(n) matchups. ----------
function nextItem() {
  const d = db[T.t];
  if (!d.unranked.length) { T = null; $('match').innerHTML = ''; $('msg').textContent = 'Ranking complete.'; render(); return; }
  T.item = d.unranked[0]; T.lo = 0; T.hi = d.ranked.length; ask();
}
function ask() {
  const d = db[T.t];
  if (T.lo >= T.hi) { d.ranked.splice(T.lo, 0, T.item); d.unranked.shift(); render(); nextItem(); return; }
  const mid = (T.lo + T.hi) >> 1;
  $('match').innerHTML = `<h3>Which do you prefer? <small class="muted">(${d.unranked.length} left to place in ${T.t})</small></h3>` +
    `<div class="vs"><button id="a">${esc(T.item)}</button><span>vs</span><button id="b">${esc(d.ranked[mid])}</button></div>` +
    `<p><button id="cancel">Cancel ranking</button></p>`;
  $('a').onclick = () => { T.hi = mid; ask(); };        // new item beats the middle: it ranks higher
  $('b').onclick = () => { T.lo = mid + 1; ask(); };
  $('cancel').onclick = () => { T = null; $('match').innerHTML = ''; render(); };
}
render();
</script>
</body>
</html>
